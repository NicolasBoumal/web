- id: '3054'
  title: Optimization beyond convexity, with a bit of geometry
  abstract: |
    Pretty much any computational task can be framed as an optimization problem. But of course, with great generality comes great complexity. Accordingly, it is fruitful to focus on problem classes which enjoy some structure. A particularly nice structure is convexity: this is well understood by now. Absent convexity, optimization problems can be arbitrarily hard. Yet, as it happens, some non-convex problems can be solved numerically in reasonable time. How do we recognize them? How do we exploit their structure? And if a problem of interest fails to have such good properties, what can we do about it? I will present some results and directions my group and I are exploring.
  events:
    - date: '2024-12-11'
      venue: Institute of Mathematics, EPFL
      location: Lausanne, Switzerland

- id: '3053'
  title: The center-stable manifold theorem for saddle avoidance, with all the details
  notes: https://www.racetothebottom.xyz/posts/saddle-avoidance-general/
  comment: This was a blackboard talk.
  abstract: |
    Gradient descent (with random initialization) almost surely avoids convergence to a (strict) saddle point. The now standard proof of that fact relies on the center-stable manifold theorem. That is an old result in dynamical systems. It is powerful, but also rigid; and the proof is rarely spelled out for the most general case. With Andreea Musat, we spent some time reconstructing the proof---this is what I'll show on the blackboard---with the hope to (at some point) extend it to apply to more optimization algorithms. The lecture notes will be posted to our group blog: https://www.racetothebottom.xyz/.
  events:
    - date: '2024-09-30'
      venue: GT "Analyse, Algorithmique, Apprentissage", LJLL, Sorbonne Université
      location: Paris, France
      link: https://www.ljll.fr/en/event/gt-analyse-algorithmique-apprentissage/

- id: '3045'
  title: 'A bumpy start: why we can''t quite accelerate gradient methods on negatively curved spaces'
  slides: downloads/AccelerationOnManifolds.pdf
  abstract: |
    What sets optimization on Euclidean spaces apart from optimization on Riemannian manifolds? Not that much. By and large, classical algorithms for smooth optimization on Euclidean spaces carry over to optimization on Riemannian manifolds, often with essentially the same (adequately rephrased) theoretical guarantees. As a notable exception, it turns out that such is not the case for Nesterov's accelerated gradient descent. Building on several ideas by Hamilton and Moitra (2021), we construct a resisting oracle that shows it is not possible to minimize smooth, strongly geodesically convex functions on Hadamard manifolds at an accelerated rate. I will give some geometric intuition as to why negative curvature makes life harder for optimizers, and why this may not be the end of the story.

    This is work with Chris Criscitiello, COLT 2022.
  events:
    - date: '2024-08-27'
      venue: ALGOPT2024 workshop on Algorithmic Optimization
      location: Louvain-la-Neuve, Belgium
    - date: '2022-10-18'
      venue: ETHZ DACO Seminar
      location: Zurich, Switzerland
      link: https://math.ethz.ch/news-and-events/events/research-seminars/daco-seminar.html?s=hs22

- id: '3052'
  title: Synchronization on circles and spheres with nonlinear interactions
  abstract: |
    Motivated by questions in control, Kuramoto networks and (highly simplified) transformers, we consider the dynamics of n points on a sphere in R^d which attract each other according to a nonlinear function of the distances between them. On spheres of dimension two or more, the points synchronize (that is, converge to the same position) quite generally. In contrast, on a circle, topological difficulties come up: we formalize those difficulties, and overcome them partly.
  events:
