- id: '3034'
  title: Geometry for reliable and efficient non-convex optimization
  abstract: |
    Non-convexity is both a challenge and an opportunity for continuous optimization, with notable applications in statistical estimation, machine learning, and inverse problems. I will illustrate how Riemannian geometry has a role to play both for analysis of non-convexity, and as a foundation for practical algorithms. As a salient example, we will see how to use Riemannian optimization to solve certain large-scale convex problems (semidefinite programs that arise as relaxations of non-convex problems) through non-convex, low-rank factorizations, with formal guarantees. This approach requires a fraction of the memory and computation time to produce a fully accurate solution.
  events:
    - date: '2019-05-20'
      venue: Operations research seminar at EPFL
      location: Lausanne, Switzerland

- id: '3033'
  title: A bit of smooth geometry and a bit of smoothed analysis for semidefinite programs in low-rank form
  abstract: |
    Semidefinite programs are optimization problems of the form: minimize a linear function of X, where X is a positive semidefinite matrix subject to linear constraints. Enforcing positive semidefiniteness can be computationally challenging. A popular heuristic is to factor X as YY*, where Y is a tall and narrow matrix. This ensures semidefiniteness for free, but breaks convexity. I will describe why, if the search space in Y is a smooth manifold, then the non-convexity is almost never an issue. Then, I will argue through smoothed analysis that the zero-measure set of bad problems is not a serious threat even for algorithms which have to terminate in finite time. As these concepts involve optimization on smooth manifolds, I will touch upon recent complexity bounds in this domain.
  events:
    - date: '2019-04-04'
      venue: Optimization seminar at ORFE
      location: Princeton, NJ, USA
    - date: '2019-03-22'
      venue: Séminaire d'analyse numérique à l'université de Genève
      location: Geneva, Switzerland

