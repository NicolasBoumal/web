- id: '3028'
  title: Near optimal bounds for phase synchronization
  slides: downloads/Phase_Synchronization_ATI.pdf
  comment: |
    These were whiteboard talks.
  abstract: |
    Phase synchronization consists in estimating n phases (unit-modulus complex numbers) given measurements of all relative phases. We assume the measurements are corrupted by i.i.d. Gaussian noise. The maximum likelihood estimator is the solution to a non-convex optimization problem, NP-hard in general. Yet, it has been observed some years ago that the maximum likelihood estimator can be computed in polynomial time through semidefinite relaxation, even in the face of tremendous amounts of noise.

    In this talk, I will present proof techniques that allow to explain this observation. This is based on the generalized power method, replicas to reduce statistical dependence, and dual certificates.

    Joint work with Yiqiao Zhong, Afonso Bandeira and Amit Singer.
  events:
    - date: '2018-01-18'
      venue: Machine Learning Seminar series at MIT
      location: Cambridge, Massachusetts, USA
    - date: '2017-12-20'
      venue: Alan Turing Institute Theory and Algorithms in Data Science Seminar
      location: London, UK

- id: '3027'
  title: 'Multireference alignment: invariant features and heterogeneity'
  abstract: |
    Consider the problem of estimating a signal x in R^n from numerous noisy observations of it, where each observation has been cyclically shifted in an unknown way. In the absence of shifts, one could simply average the observations. Thus, one natural approach is to try first to align (undo the shifts), then average. Unfortunately, beyond a certain noise level, aligning is impossible.

    I will show how the signal x can be estimated from the observations directly, without alignment. The technique relies on so-called invariant features: moments of the data that are invariant under cyclic shifts. Recovering the signal from these moments is a non-convex problem and I'll discuss some ideas that allow to solve it in practice.

    Going a few steps further, we will get into a heterogeneous variant of this problem and a 2D version of it. At that point, I will show the connections with cryo electron microscopy---the motivating application for this work.
  events:
    - date: '2017-11-10'
      venue: Simons Algorithms and Geometry meeting on multi-reference alignment
      location: New York City, NY, USA
    - date: '2017-10-31'
      venue: IMA Data Science Lab Seminar
      location: Minneapolis, Minnesota, USA
      video: https://www.ima.umn.edu/2017-2018/DSS9.5.17-5.29.18/26405

- id: '3025'
  title: 'Semidefinite programs with a dash of smoothness: why the low-rank approach works'
  abstract: |
    Semidefinite programs (SDPs) can be solved in polynomial time by interior point methods, but scalability can be an issue. To address this shortcoming, over a decade ago, Burer and Monteiro proposed to solve SDPs with few equality constraints via low-rank, non-convex surrogates. Remarkably, for some applications, local optimization methods seem to converge to global optima of these non-convex surrogates reliably.

    In this presentation, we show that the Burer-Monteiro formulation of SDPs in a certain class almost never has any spurious local optima, that is: the non-convexity of the low-rank formulation is benign (even saddles are strict). This class of SDPs covers applications such as max-cut, community detection in the stochastic block model, robust PCA, phase retrieval and synchronization of rotations.

    The crucial assumption we make is that the low-rank problem lives on a manifold. Then, theory and algorithms from optimization on manifolds can be used.

    Optimization on manifolds is about minimizing a cost function over a smooth manifold, such as spheres, low-rank matrices, orthonormal frames, rotations, etc. We will present the basic framework as well as parts of the more general convergence theory, including recent complexity results. (Toolbox: http://www.manopt.org)

    Select parts are joint work with P.-A. Absil, A. Bandeira, C. Cartis and V. Voroninski.
