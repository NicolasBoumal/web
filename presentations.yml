- id: '3017'
  title: A tale of convex and Riemannian geometry for low-rank optimization
  abstract: |
    Motivated by applications involving orthogonal matrices, I will discuss optimization over the set of positive semidefinite matrices whose diagonal blocks are small identity matrices. This is a convex set. Interestingly, the subsets of feasible matrices of bounded rank admit a nice Riemannian geometry, making it relatively simple to optimize over them directly. This is especially interesting given that the optimizers of the full problem often have low-rank (a phenomenon we will study). I will show how, combining insights from both convex and Riemannian geometry, we can attain a better understanding of this class of problems (chiefly relating critical points of the rank-restricted problem to KKT points of the full problem) and develop better algorithms.
  events:
    - date: '2015-06-11'
      venue: 'HCM Workshop: Low-rank Optimization and Applications'
      location: Bonn, Germany
      link: http://www.hcm.uni-bonn.de/events/eventpages/2015/workshop-low-rank-optimization-and-applications/

- id: '3016'
  title: Optimization on manifolds <3 convex optimization
  abstract: |
    Hello! I'm Nicolas. I just joined SIERRA @ INRIA to work with Alexandre d'Aspremont as a postdoc. I will talk about optimization on manifolds, its ties with convex optimization, and semidefinite relaxations.

    Optimization on manifolds is about solving problems of the form "minimize f(x), where x belongs to a nice, known manifold". This comes up in applications all the time (think: orthogonality or low-rank constraints). We develop a Matlab toolbox to tackle such problems: http://www.manopt.org (it is documented).

    The boundary of convex sets sometimes has a nice differentiable geometry. For example, the boundary of a ball is a sphere; the boundary of the semidefinite cone is a union of fixed-rank matrices. Since solutions often lie on the boundary of the search space, this leads to interesting cross-fertilizations between convex optimization and optimization on manifolds.

    As an example, we will estimate a collection of rotations based on noisy measurements of pairwise relative rotations (think: cameras). The group of rotations is a smooth manifold, hence the corresponding maximum likelihood estimation problem lives on a manifold too. Additionally, it admits a beautiful semidefinite relaxation (via lifting). I will show how optimization on manifolds can help both solve this relaxation fast, and refine its output. Then, I will show evidence that this relaxation is tight incredibly often, and I will outline elements of a proof for this phenomenon.

    Core parts of this talk are joint work with P.-A. Absil and V. Blondel (UCLouvain), B. Mishra (Univ. de Liège), R. Sepulchre (Univ. of Cambridge), and A. Singer and A. Bandeira (Princeton U.).
  events:
