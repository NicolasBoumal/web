- id: '3058'
  title: Escaping saddles in high dimensions
  slides: https://optim-epfl.gitlab.io/talks/randomizedTR/randomizedTR.html#/
  abstract: |
    Consider minimizing a nonconvex function $f \colon \reals^d \to \reals$. To escape its saddle points, a deterministic algorithm needs at least Omega(d) "pieces of information" about f (think: gradients or Hessian-vector products). In stark contrast, randomized algorithms can bring this complexity down to poly-log(d). On the flip side, those randomized algorithms "bob around": they do not converge. We propose an algorithm which is (aptly) able to amplify the randomization when we are near a saddle, but which is also able to "absorb" the randomization when we are near a minimizer (in order to converge there). The method is based on conjugate gradients and trust regions: https://arxiv.org/abs/2603.15494.
  events:
    - date: '2026-06-18'
      venue: Randomized Numerical Linear Algebra, Bernoulli Center workshop
      location: Lausanne, Switzerland
      link: https://sites.google.com/view/randnlaworkshop/home

- id: '3057'
  title: Smooth, globally Polyak-Łojasiewicz functions are nonlinear least-squares
  slides: https://optim-epfl.gitlab.io/talks/globalPL/globalPL.html
  abstract: |
    Polyak-Łojasiewicz (PŁ) functions abound in the literature, especially in nonconvex optimization. When they are also smooth, they become surprisingly simple---with an exotic twist. The plan is for us to discover the structure of those functions and of their sets of minimizers via gradient flow and fiber bundles.

    Joint work with Christopher Criscitiello and Quentin Rebjock.
  events:
    - date: '2026-05-11'
      venue: Machine Learning and Data Science Seminar
      location: Oxford, UK
    - date: '2026-04-02'
      venue: Statlearn
      location: Grenoble, France

- id: '3056'
  title: 'Saddle point avoidance in optimization with deterministic algorithms: refined proof techniques'
  abstract: |
    It is an unfortunate fact that reasonable optimization algorithms may converge to saddle points (for our purpose: critical points which are not even local minimizers). That said, this is exceedingly rare. Typically, if the initialization is generic (e.g., if it is random), then we do not see such bad behavior. This was first formalized for gradient descent with constant step size by Lee et al. (2016). Since then, several extensions were proposed, but all of them are restricted to simple algorithms (essentially iterating a nice map). The proofs (which rely on the Center Stable Manifold Theorem) do not extend to seemingly simple variations such as gradient descent with a line-search method. I will present ongoing work with Andreea Musat where we refine existing proof techniques to extend them to a first line-search method. These results also apply for Riemannian optimization, with some friction.
  events:
    - date: '2025-04-04'
      venue: Seminar on the interactions between statistics and geometry
      online: true
      link: https://qparis-math.github.io/seminar/

