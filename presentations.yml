- id: '3023'
  title: Optimization on manifolds and semidefinite relaxations
  slides: downloads/ICML_Gimli_2016.pdf
  abstract: |
    Optimization on manifolds is about minimizing a cost function over a smooth manifold, such as spheres, low-rank matrices, orthonormal frames, rotations, etc. I will present the basic framework as well as some of the more general convergence results, including recent complexity results.

    This is nonconvex optimization; there are no global optimality guarantees in general. Nevertheless, I will discuss a class of problems related to semidefinite relaxations for Max-Cut and community detection in the stochastic block model for which standard optimization algorithms on manifolds converge to global optimizers. This is part of a growing set of applications on manifolds with stronger theoretical backup.

    Experiments with Manopt: our Matlab toolbox for optimization on manifolds available at www.manopt.org.
