- id: '3018'
  title: Tight relaxations for phase synchronization
  abstract: |
    We consider the problem of estimating phases (points on a circle) from noisy, pairwise, relative phase measurements. Assuming Gaussian noise, the maximum likelihood estimator (MLE) is the solution of a hard, nonconvex quadratically constrained quadratic program. The latter can be relaxed into a semidefinite program (SDP) by lifting (dropping a rank 1 constraint). Remarkably, this SDP turns out to be tight (i.e., it reveals the true MLE in polynomial time) with high probability, even in the face of large noise. We provide a proof of this statement in a preprint: http://arxiv.org/abs/1411.3272. Come see the talk for a quick tour and intuition!
