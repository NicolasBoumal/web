- id: '3032'
  title: 'Estimating a cloud of points under rotations and huge noise: variations on Procrustes'
  abstract: |
    We want to estimate a cloud of k points in R^d, that is, a matrix X of size
    d by k. What we get to see is randomly rotated versions of that cloud,
    corrupted by Gaussian noise. We see many independent such realizations.
    Surely, if the noise level isn't too bad, then we can estimate the
    rotations, undo them, and average the aligned clouds. That will reduce the
    noise level. But what if the noise level is so high that it is
    fundamentally impossible to estimate the rotations? Can we still estimate
    the cloud is such conditions? The answer is yes: I will show a practical
    algorithm to do it. The algorithm is based on elementary notions of
    invariant theory and linear algebra. Then, I will argue that no algorithm
    can do significantly better. This is joint work with Thomas Pumir, who is a
    graduate student in ORFE.
  events:
    - date: '2018-11-30'
      venue: What's happening in Fine Hall? (Math department lunch talk)
      location: Princeton, NJ, USA

- id: '3031'
  title: Handling non-convexity in low-rank approaches for semidefinite programming
  slides: downloads/PACM_Colloquium_2018.pdf
  abstract: |
    A semidefinite program (SDP) is an optimization problem where one seeks to minimize a linear function of a positive semidefinite matrix X under linear constraints. SDPs have generated sustained interest since the nineties owing to their powerful expressiveness. Standard algorithms solve SDPs in polynomial time, but they fail in practice for large problems.

    To address scaling issues, in the early 2000s, Burer and Monteiro proposed the following heuristic: factorize X as YY*, where Y is a 'tall and narrow' matrix of size n x p. Not only is positive semidefiniteness now mechanically enforced at no cost, but also one gets better control over the dimensionality of the problem through p. However, the optimization problem in Y is non-convex: it is a priori unclear how to solve it.

    In this talk, I will show that the Burer-Monteiro heuristic is sound, under certain geometric conditions. Specifically, my collaborators and I proved that if the constraints on Y regularly define a smooth manifold, then, for almost any linear cost function, standard necessary optimality conditions turn out to be sufficient as well: non-convexity is benign. We established this result with optimally small p. I will further mention extensions of such results based on smoothed analysis.

    Under the regularity condition, we get an optimization problem in Y on a smooth manifold: I will also mention recent results regarding the complexity of practical algorithms for such problems.


    The main parts are joint work with Afonso Bandeira and Vlad Voroninski.
  events:
    - date: '2018-10-08'
      venue: Colloquium Series for the Program in Applied and Computational Mathematics
      location: Princeton, NJ, USA

- id: '3030'
  title: Worst-case complexity bounds for optimization on manifolds
  slides: downloads/ISMP%202018%20Worst%20case%20convergence%20on%20manifolds.pdf
  abstract: |
    I will present some recent bounds on the number of iterations one might need to compute approximate stationary points (both first and second order) for optimization problems on smooth manifolds. In particular, I will present reasonable assumptions one can make about a problem so that the classical proofs from unconstrained optimization carry over painlessly. The talk will focus on gradient descent and trust-region methods on manifolds. Such bounds are relevant to understand the worst-case computational cost of learning algorithms when the sought parameters live on a smooth, known manifold.
  events:
    - date: '2018-07-02'
      venue: International Symposium on Mathematical Programming (ISMP)
      location: Bordeaux, France

